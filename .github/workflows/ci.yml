name: dev-metrics-ci
on: [push, pull_request]
jobs:
  test-and-collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Collect run metrics
        env:
          PYTHONPATH: src
        run: |
          python -m dev_metrics collect --db metrics.db --test-seconds 0 --tests-passed 6 --tests-total 6
          python -m dev_metrics dashboard --db metrics.db --output dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: dev-metrics-dashboard
          path: dashboard.html
