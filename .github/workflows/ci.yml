name: dev-metrics-ci
on: [push, pull_request]
jobs:
  test-and-collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests and collect actual metrics
        env:
          PYTHONPATH: src
        run: python -m dev_metrics.ci --db metrics.db
      - name: Render dashboard
        if: always()
        env:
          PYTHONPATH: src
        run: python -m dev_metrics dashboard --db metrics.db --output dashboard.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-metrics-dashboard
          path: dashboard.html
