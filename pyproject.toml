[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-metrics-demo"
version = "0.1.0"
description = "Idempotent CI metrics collection and static dashboard"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dev-metrics = "dev_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
