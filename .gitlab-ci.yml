stages: [verify]

verify_and_collect:
  stage: verify
  image: python:3.12-slim
  script:
    - export PYTHONPATH="$CI_PROJECT_DIR/src"
    - python -m dev_metrics.ci --db metrics.db
    - python -m dev_metrics dashboard --db metrics.db --output dashboard.html
  artifacts:
    when: always
    paths: [metrics.db, dashboard.html]
    expire_in: 7 days
  timeout: 5m
